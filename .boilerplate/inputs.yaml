# Module configuration — AWS WAFv2 Management
#
# This file is loaded by terragrunt.hcl as local.local_vars and wired into the
# module `inputs` block. Only module-specific variables belong here.
# The following are supplied automatically by the Terragrunt hierarchy and must
# NOT be declared in this file:
#   is_hub      -> injected by the boilerplate/template engine
#   spoke_def   -> sourced from spoke-inputs.yaml
#   org         -> sourced from env-inputs.yaml
#   extra_tags  -> built from the merged *-tags.json files

# ── Web ACL naming — set name OR name_prefix, never both ──────────────────────
# name: "my-waf-acl"        # (Required if name_prefix is not set) Explicit name for the WAF ACL.
#                           #   Used verbatim, no system_name suffix is appended. Default: null.
name_prefix: "myapp"        # (Required if name is not set) Prefix prepended to the computed
                            #   system_name to form the ACL name: "<name_prefix>-<system_name>".
                            #   Default: null. The module fails at plan time when both are null.

# ── settings — all WAF configuration lives under this single key ──────────────
settings:                                    # (Optional) WAF module settings. Default: {}

  # ── Top-level ACL settings ──────────────────────────────────────────────────
  scope: "REGIONAL"                          # (Required) Scope of the Web ACL: REGIONAL | CLOUDFRONT.
                                             #   CLOUDFRONT-scoped ACLs must be deployed in us-east-1.
  default_action: "allow"                    # (Optional) Action when no rule matches: allow | block. Default: allow.
  # description: "Production WAF ACL"        # (Optional) Human-readable description of the ACL. Default: null.
  # token_domains:                           # (Optional) Domains AWS WAF accepts CAPTCHA/challenge tokens from.
  #   - "example.com"                        #   Enables cross-domain token reuse. Default: [].

  # ── CAPTCHA and challenge config (web ACL level) ────────────────────────────
  # captcha_config:                          # (Optional) Web ACL-level CAPTCHA token immunity time.
  #   immunity_time: 300                     #   (Required) Seconds a CAPTCHA token stays valid (60–259200). Default: 300.
  # challenge_config:                        # (Optional) Web ACL-level challenge token immunity time.
  #   immunity_time: 300                     #   (Required) Seconds a challenge token stays valid (300–259200). Default: 300.

  # ── Association config — request body inspection size limits ────────────────
  # association_config:                      # (Optional) Overrides the default 16 KB body inspection limit.
  #   request_body:                          #   (Optional) Per-resource-type size limit overrides.
  #     - api_gateway:                       #     (Optional) API Gateway REST API.
  #         default_size_inspection_limit: "KB_16"   # (Required) KB_16 | KB_32 | KB_48 | KB_64.
  #     - app_runner_service:                #     (Optional) AWS App Runner service.
  #         default_size_inspection_limit: "KB_16"
  #     - cloudfront:                        #     (Optional) CloudFront distribution.
  #         default_size_inspection_limit: "KB_16"
  #     - cognito_user_pool:                 #     (Optional) Amazon Cognito user pool.
  #         default_size_inspection_limit: "KB_16"
  #     - verified_access_instance:          #     (Optional) AWS Verified Access instance.
  #         default_size_inspection_limit: "KB_16"

  # ── Custom response bodies ──────────────────────────────────────────────────
  # custom_response_bodies:                  # (Optional) Named bodies reusable from block actions. Default: [].
  #   - key: "custom-403"                    #   (Required) Unique key referenced by a block action custom_response.
  #     content: "<html>Blocked</html>"      #   (Required) Response body content.
  #     content_type: "TEXT_HTML"            #   (Required) TEXT_PLAIN | TEXT_HTML | APPLICATION_JSON.

  # ── Top-level visibility config ─────────────────────────────────────────────
  # visibility_config:                       # (Optional) CloudWatch metrics/sampling defaults for the ACL.
  #   cloudwatch_metrics_enabled: true       #   (Optional) Publish CloudWatch metrics. Default: true.
  #   metric_name: "my-waf-acl"              #   (Optional) CloudWatch metric name. Default: the ACL name.
  #   sampled_requests_enabled: true         #   (Optional) Store a sample of matched requests. Default: true.

  # ── IP sets (created by this module, referenceable with ref:) ───────────────
  # ip_sets:                                 # (Optional) Module-managed IP sets. Default: [].
  #   - name: "blocked-ips"                  #   (Required) Module-internal key; final name is "<acl-name>-<name>".
  #     ip_address_version: "IPV4"           #   (Required) IPV4 | IPV6.
  #     addresses:                           #   (Optional) CIDR blocks matching ip_address_version. Default: [].
  #       - "203.0.113.0/24"
  #     description: "Known bad IPv4 ranges" #   (Optional) Human-readable description. Default: null.

  # ── Regex pattern sets (created by this module, referenceable with ref:) ────
  # regex_pattern_sets:                      # (Optional) Module-managed regex pattern sets. Default: [].
  #   - name: "malicious-paths"              #   (Required) Module-internal key; final name is "<acl-name>-<name>".
  #     patterns:                            #   (Required) PCRE-compatible regex strings.
  #       - "^/admin/.*"
  #       - "^/wp-.*"
  #     description: "Attack path patterns"  #   (Optional) Human-readable description. Default: null.

  # ── API keys (mobile SDK token domain integration) ──────────────────────────
  # api_keys:                                # (Optional) WAFv2 API keys for the mobile SDK. Default: [].
  #   - name: "mobile-app"                   #   (Required) Module-internal label used as the for_each key.
  #     token_domains:                       #   (Required) Fully qualified domains validated for tokens.
  #       - "app.example.com"

  # ── Web ACL associations ────────────────────────────────────────────────────
  # associations:                            # (Optional) Resources to attach the ACL to. Default: [].
  #   - resource_arn: "arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/my-alb/abc123"
  #                                          #   (Required) ARN of an ALB, API Gateway stage, AppSync GraphQL API,
  #                                          #     Cognito user pool, App Runner service, or Verified Access instance.
  #                                          #     CLOUDFRONT-scoped ACLs cannot use this — attach the ACL from the
  #                                          #     CloudFront distribution instead.

  # ── AWS managed rule groups ─────────────────────────────────────────────────
  managed_rules:                             # (Optional) AWS managed rule groups to attach. Default: [].
    - name: "AWSManagedRulesCommonRuleSet"   #   (Required) AWS managed rule group name.
      priority: 10                           #   (Required) Evaluation priority, unique across ALL ACL rules; lower runs first.
    - name: "AWSManagedRulesKnownBadInputsRuleSet"
      priority: 20
