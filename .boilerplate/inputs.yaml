  # ── Logging ─────────────────────────────────────────────────────────────────
  # logging:                                 # (Optional) WAF logging configuration. Default: {} (disabled).
  #   enabled: true                          #   (Optional) Enable WAF logging. Default: false. When true the module
  #                                          #     creates a CloudWatch log group named "aws-waf-logs-<acl-name>" and
  #                                          #     adds it as the first log destination automatically.
  #   retention_in_days: 90                  #   (Optional) Log group retention. Default: 90. Valid: 1, 3, 5, 7, 14, 30,
  #                                          #     60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557,
  #                                          #     2922, 3288, 3653, or 0 for never expire.
  #   kms_key_id: null                       #   (Optional) KMS key ARN encrypting the log group. Default: null.
  #   destination_arns:                      #   (Optional) Extra destinations beyond the auto-created log group. Default: [].
  #     - "arn:aws:firehose:us-east-1:123456789012:deliverystream/aws-waf-logs-acme"
  #                                          #     Kinesis Data Firehose (name must start with "aws-waf-logs-") or S3 bucket ARNs.
  #   redacted_fields:                       #   (Optional) Fields omitted from stored log records. Default: [].
  #     - type: "SINGLE_HEADER"              #     (Required) URI_PATH | QUERY_STRING | METHOD | SINGLE_HEADER.
  #       name: "authorization"              #     (Optional) Header name — required only for SINGLE_HEADER.
  #   filter:                                #   (Optional) Controls which requests reach the log destinations.
  #     default_behavior: "DROP"             #     (Required) Behavior for requests matching no filter: KEEP | DROP.
  #     filters:                             #     (Required) Ordered filter rules.
  #       - behavior: "KEEP"                 #       (Required) Outcome for matching requests: KEEP | DROP.
  #         requirement: "MEETS_ANY"         #       (Required) MEETS_ANY (OR) | MEETS_ALL (AND).
  #         conditions:                      #       (Required) Match conditions.
  #           - action_condition: "BLOCK"    #         (Optional) Match on the WAF action: ALLOW | BLOCK | COUNT.
  #           - label_name_condition: "awswaf:managed:aws:core-rule-set:NoUserAgent_Header"
  #                                          #         (Optional) Match on a label name or namespace prefix.
