  #             positional_constraint: "CONTAINS"
  #             field_to_match:
  #               type: "URI_PATH"
  #     or_statement:                        #   (Optional) Matches when ANY inner statement matches.
  #       statements:                        #     (Required) At least 2 inner statements, same schema as and_statement.
  #         - geo_match:
  #             country_codes: ["KP", "IR"]
