  #         - priority: 0
  #           type: "LOWERCASE"
  #
  #     # Compound statements — wrap leaf statements. Terraform does not support
  #     # unlimited recursion: one extra level of not/and/or nesting is supported,
  #     # and inner leaf statements are limited to the seven core field_to_match
  #     # types (URI_PATH, QUERY_STRING, METHOD, BODY, ALL_QUERY_ARGUMENTS,
  #     # SINGLE_HEADER, SINGLE_QUERY_ARGUMENT).
  #     not_statement:                       #   (Optional) Matches when the inner statement does NOT match.
